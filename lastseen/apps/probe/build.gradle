// Plain Android hardware-probe app (no Capacitor, no web layer). See docs/apk-setup.md.
buildscript {
    ext {
        kotlinVersion = '2.2.20'
        androidxAppCompatVersion = '1.7.1'
        androidxCameraVersion = '1.6.2'
        androidxCoreVersion = '1.17.0'
        androidxLifecycleVersion = '2.9.4'
        junitVersion = '4.13.2'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
