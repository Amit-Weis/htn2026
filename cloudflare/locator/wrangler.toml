name = "htn-locator"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[vars]
DETECT_MODEL = "@cf/facebook/detr-resnet-50"
MIN_SCORE = "0.5"
# PLACEHOLDER calibration for the Beam Pro back cameras: measure both, or pass ?fx=&baseline= per request.
BASELINE_M = "0.06"
HFOV_DEG = "65"
# Omni voice endpoint (POST /command). Fill from your yibuapi key email / pricing page; the key itself is a
# secret: `npx wrangler secret put OMNI_API_KEY`. Base URL is the OpenAI-compatible root (ends in /v1).
OMNI_BASE_URL = ""
OMNI_MODEL = ""
# Set to "1" if the first camera in the side-by-side photo is actually the right one.
STEREO_SWAP = "0"
