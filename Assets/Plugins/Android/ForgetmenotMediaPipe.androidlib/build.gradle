apply plugin: 'com.android.library'

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'
}

android {
    namespace 'com.forgetmenot.cv'
    compileSdk 36

    defaultConfig {
        minSdk 29
        targetSdk 36
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}
